name: City Catalog Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/process_geonames_cities.py'
      - '.github/workflows/city-catalog-benchmark.yml'
      - 'docs/CITY_DATA.md'
      - 'THIRD_PARTY_NOTICES.md'

jobs:
  android-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset: [cities15000, cities5000, cities1000, cities500]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Download permitted GeoNames build inputs
        run: |
          mkdir -p build/geonames
          curl --fail --location --retry 3 -o build/geonames/${{ matrix.dataset }}.zip https://download.geonames.org/export/dump/${{ matrix.dataset }}.zip
          curl --fail --location --retry 3 -o build/geonames/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          curl --fail --location --retry 3 -o build/geonames/admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
      - name: Generate and benchmark compact catalog
        run: |
          python3 scripts/process_geonames_cities.py \
            --dataset ${{ matrix.dataset }} \
            --cities-zip build/geonames/${{ matrix.dataset }}.zip \
            --country-info build/geonames/countryInfo.txt \
            --admin1 build/geonames/admin1CodesASCII.txt \
            --output build/city-catalog/city_catalog.tsv \
            --report build/city-catalog/report.json
      - name: Measure Android package impact
        run: |
          mkdir -p androidApp/src/main/assets
          cp build/city-catalog/city_catalog.tsv.gz androidApp/src/main/assets/city_catalog.tsv.gz
          gradle :androidApp:assembleDebug --stacktrace
          test -f androidApp/build/outputs/apk/debug/androidApp-debug.apk
          python3 - <<'PY'
          import json, pathlib
          report_path = pathlib.Path('build/city-catalog/report.json')
          report = json.loads(report_path.read_text())
          report['android_apk_bytes'] = pathlib.Path('androidApp/build/outputs/apk/debug/androidApp-debug.apk').stat().st_size
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: city-catalog-${{ matrix.dataset }}
          path: |
            build/city-catalog/report.json
            build/city-catalog/city_catalog.tsv.gz
          retention-days: 7

  ios-benchmark:
    needs: android-benchmark
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        dataset: [cities15000, cities5000, cities1000, cities500]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: city-catalog-${{ matrix.dataset }}
          path: build/city-catalog
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Bundle catalog into iOS source resources
        run: |
          mkdir -p iosApp/SalatApp/Resources
          cp build/city-catalog/city_catalog.tsv.gz iosApp/SalatApp/Resources/city_catalog.tsv.gz
      - run: gradle :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml --project iosApp
      - name: Build and measure iOS app
        run: |
          xcodebuild \
            -project iosApp/SalatApp.xcodeproj \
            -scheme SalatApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SalatDerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/SalatDerivedData/Build/Products/Debug-iphonesimulator/Salat.app"
          test -f "$APP/city_catalog.tsv.gz"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Salat.zip"
          python3 - <<'PY'
          import json, os, pathlib
          report_path = pathlib.Path('build/city-catalog/report.json')
          report = json.loads(report_path.read_text())
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'SalatDerivedData/Build/Products/Debug-iphonesimulator/Salat.app'
          report['ios_app_bytes'] = sum(p.stat().st_size for p in app.rglob('*') if p.is_file())
          report['ios_zip_bytes'] = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'Salat.zip').stat().st_size
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: city-catalog-ios-${{ matrix.dataset }}
          path: build/city-catalog/report.json
          retention-days: 7
