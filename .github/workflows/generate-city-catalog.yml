name: Generate Production City Catalog

# Deliberately dispatch-only. This workflow holds contents:write and commits a
# generated runtime resource, so it must never fire from an ordinary push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download GeoNames build inputs
        run: |
          mkdir -p build/geonames
          curl --fail --location --retry 3 -o build/geonames/cities5000.zip https://download.geonames.org/export/dump/cities5000.zip
          curl --fail --location --retry 3 -o build/geonames/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          curl --fail --location --retry 3 -o build/geonames/admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
          curl --fail --location --retry 3 -o build/geonames/alternateNamesV2.zip https://download.geonames.org/export/dump/alternateNamesV2.zip
      - name: Generate production catalog
        run: |
          python3 scripts/process_geonames_cities.py \
            --dataset cities5000 \
            --cities-zip build/geonames/cities5000.zip \
            --country-info build/geonames/countryInfo.txt \
            --admin1 build/geonames/admin1CodesASCII.txt \
            --alternate-names-zip build/geonames/alternateNamesV2.zip \
            --output build/city-catalog/city_catalog.tsv \
            --report build/city-catalog/report.json
      - name: Verify multilingual search aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('build/city-catalog/city_catalog.tsv').read_text(encoding='utf-8')
          required = ['İstanbul', '北京', 'ঢাকা', 'تهران', 'کراچی']
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Missing required multilingual city aliases: {missing}')
          print('Multilingual alias verification passed:', ', '.join(required))
          PY
      - name: Commit generated runtime resource
        run: |
          mkdir -p resources data
          cp build/city-catalog/city_catalog.tsv resources/city_catalog.tsv
          cp build/city-catalog/report.json data/city_catalog_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/city_catalog.tsv data/city_catalog_report.json
          if git diff --cached --quiet; then
            echo "Generated catalog is unchanged"
            exit 0
          fi
          git commit -m "Bundle generated offline city catalog"
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-city-catalog-cities5000
          path: |
            build/city-catalog/city_catalog.tsv
            build/city-catalog/city_catalog.tsv.gz
            build/city-catalog/report.json
          retention-days: 7
