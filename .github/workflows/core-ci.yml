name: Core CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Validate localization resources
        run: python3 scripts/validate_localizations.py
      - name: Run shared JVM tests
        run: gradle :shared:jvmTest --stacktrace
      - name: Compile Android debug app
        run: gradle :androidApp:assembleDebug --stacktrace
      - name: Verify prototype JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('prototype/index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>(.*?)</script>', html, re.S)
          assert script, 'prototype script not found'
          pathlib.Path('/tmp/salat-prototype.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/salat-prototype.js
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: salat-android-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android compile SDK for KMP project configuration
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build shared iOS simulator framework
        run: gradle :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml --project iosApp
      - name: Build iOS simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/SalatApp.xcodeproj \
            -scheme SalatApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SalatDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify built app bundle
        run: |
          test -d "$RUNNER_TEMP/SalatDerivedData/Build/Products/Debug-iphonesimulator/Salat.app"
          test -f "$RUNNER_TEMP/SalatDerivedData/Build/Products/Debug-iphonesimulator/Salat.app/Info.plist"
      - name: Package iOS simulator app
        run: |
          cd "$RUNNER_TEMP/SalatDerivedData/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent Salat.app "$RUNNER_TEMP/Salat-iOS-Simulator.zip"
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: salat-ios-simulator
          path: ${{ runner.temp }}/Salat-iOS-Simulator.zip
          retention-days: 7
