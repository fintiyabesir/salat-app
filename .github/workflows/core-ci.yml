name: Core CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate localization resources
        run: python3 scripts/validate_localizations.py
      - name: Run shared JVM tests
        run: ./gradlew :shared:jvmTest --stacktrace
      - name: Compile Android debug app
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug :wearApp:testDebugUnitTest --stacktrace
      - name: Validate LTR and RTL screenshots
        run: ./gradlew :androidApp:validateDebugScreenshotTest --stacktrace
      - name: Verify Android bundled city catalog
        run: |
          APK="androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          MANIFEST="$RUNNER_TEMP/android-manifest.xml"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" \
            --file AndroidManifest.xml > "$MANIFEST"
          grep -q 'PhoneWearTimelineService' "$MANIFEST"
          unzip -l "$APK" | grep -q 'assets/city_catalog.tsv'
          EXPECTED="$(sha256sum resources/city_catalog.tsv | awk '{print $1}')"
          ACTUAL="$(unzip -p "$APK" assets/city_catalog.tsv | sha256sum | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -p "$APK" assets/city_catalog.tsv | head -n 1 | grep -q '#salat-city-catalog-v2'
      - name: Verify Wear OS APK surfaces
        run: |
          APK="wearApp/build/outputs/apk/debug/wearApp-debug.apk"
          MANIFEST="$RUNNER_TEMP/wear-manifest.xml"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" \
            --file AndroidManifest.xml > "$MANIFEST"
          grep -q 'android.hardware.type.watch' "$MANIFEST"
          grep -q 'WearMainActivity' "$MANIFEST"
          grep -q 'WearPrayerTileService' "$MANIFEST"
          grep -q 'NextPrayerComplicationService' "$MANIFEST"
          grep -q 'WearTimelineListenerService' "$MANIFEST"
      - name: Verify prototype JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('prototype/index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>(.*?)</script>', html, re.S)
          assert script, 'prototype script not found'
          pathlib.Path('/tmp/salat-prototype.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/salat-prototype.js
      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: salat-android-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7
      - name: Upload Wear OS debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: salat-wear-os-debug
          path: wearApp/build/outputs/apk/debug/wearApp-debug.apk
          retention-days: 7

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - name: Install Android compile SDK for KMP project configuration
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build shared iOS simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml --project iosApp
      - name: Verify XcodeGen preserves app metadata
        run: |
          git diff --exit-code -- \
            iosApp/SalatApp/Info.plist \
            iosApp/SalatApp/SalatApp.entitlements \
            iosApp/SalatWidget/Info.plist \
            iosApp/SalatWidget/SalatWidget.entitlements \
            iosApp/SalatWatch/Info.plist \
            iosApp/SalatWatch/SalatWatch.entitlements \
            iosApp/SalatWatchComplication/Info.plist \
            iosApp/SalatWatchComplication/SalatWatchComplication.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' iosApp/SalatApp/Info.plist)" = '$(MARKETING_VERSION)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' iosApp/SalatApp/Info.plist)" = '$(CURRENT_PROJECT_VERSION)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' iosApp/SalatApp/Info.plist)" = 'false'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:0' iosApp/SalatApp/Info.plist)" = 'UIInterfaceOrientationPortrait'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:1' iosApp/SalatApp/Info.plist)" = 'UIInterfaceOrientationPortraitUpsideDown'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:2' iosApp/SalatApp/Info.plist)" = 'UIInterfaceOrientationLandscapeLeft'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:3' iosApp/SalatApp/Info.plist)" = 'UIInterfaceOrientationLandscapeRight'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' iosApp/SalatWidget/Info.plist)" = '$(EXECUTABLE_NAME)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' iosApp/SalatWidget/Info.plist)" = 'com.apple.widgetkit-extension'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' iosApp/SalatApp/SalatApp.entitlements)" = 'group.app.salat.mobile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' iosApp/SalatWidget/SalatWidget.entitlements)" = 'group.app.salat.mobile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' iosApp/SalatWatch/Info.plist)" = '$(CURRENT_PROJECT_VERSION)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' iosApp/SalatWatch/Info.plist)" = '$(PRODUCT_BUNDLE_IDENTIFIER)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' iosApp/SalatWatch/Info.plist)" = '$(EXECUTABLE_NAME)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' iosApp/SalatWatchComplication/Info.plist)" = '$(PRODUCT_BUNDLE_IDENTIFIER)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' iosApp/SalatWatchComplication/Info.plist)" = '$(EXECUTABLE_NAME)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' iosApp/SalatWatch/SalatWatch.entitlements)" = 'group.app.salat.mobile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' iosApp/SalatWatchComplication/SalatWatchComplication.entitlements)" = 'group.app.salat.mobile'
      - name: Build watchOS simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/SalatApp.xcodeproj \
            -scheme SalatWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SalatWatchDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify watchOS app and complication
        run: |
          WATCH_APP="$RUNNER_TEMP/SalatWatchDerivedData/Build/Products/Debug-watchsimulator/SalatWatch.app"
          COMPLICATION="$WATCH_APP/PlugIns/SalatWatchComplication.appex"
          test -d "$WATCH_APP"
          test -f "$WATCH_APP/Info.plist"
          test -d "$COMPLICATION"
          test -f "$COMPLICATION/Info.plist"
          test -f "$WATCH_APP/PrivacyInfo.xcprivacy"
          test -f "$COMPLICATION/PrivacyInfo.xcprivacy"
          for locale in en tr ar fa ur bn ms zh-Hans zh-Hant; do
            test -f "$WATCH_APP/$locale.lproj/Watch.strings"
            test -f "$COMPLICATION/$locale.lproj/Watch.strings"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$WATCH_APP/Info.plist")" = 'SalatWatch'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$COMPLICATION/Info.plist")" = 'SalatWatchComplication'
          test -x "$WATCH_APP/SalatWatch"
          test -x "$COMPLICATION/SalatWatchComplication"
      - name: Build iOS simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/SalatApp.xcodeproj \
            -scheme SalatApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SalatDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify built app bundle
        run: |
          APP="$RUNNER_TEMP/SalatDerivedData/Build/Products/Debug-iphonesimulator/Salat.app"
          CATALOG="$APP/city_catalog.tsv"
          WIDGET="$APP/PlugIns/SalatWidgetExtension.appex"
          WATCH="$APP/Watch/SalatWatch.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$CATALOG"
          test -d "$WIDGET"
          test -f "$WIDGET/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:3' "$APP/Info.plist")" = 'UIInterfaceOrientationLandscapeRight'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$WIDGET/Info.plist")" = 'SalatWidgetExtension'
          test -x "$WIDGET/SalatWidgetExtension"
          otool -l "$WIDGET/SalatWidgetExtension" | grep -q '__swift5_entry'
          test -d "$WATCH"
          test -f "$WATCH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH/Info.plist")" = 'app.salat.mobile.watchapp'
          xcrun vtool -show-build "$WATCH/SalatWatch" | grep -q 'platform WATCHOSSIMULATOR'
          EXPECTED="$(shasum -a 256 resources/city_catalog.tsv | awk '{print $1}')"
          ACTUAL="$(shasum -a 256 "$CATALOG" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          head -n 1 "$CATALOG" | grep -q '#salat-city-catalog-v2'
      - name: Package iOS simulator app
        run: |
          cd "$RUNNER_TEMP/SalatDerivedData/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent Salat.app "$RUNNER_TEMP/Salat-iOS-Simulator.zip"
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: salat-ios-simulator
          path: ${{ runner.temp }}/Salat-iOS-Simulator.zip
          retention-days: 7
