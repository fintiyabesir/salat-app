name: Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install stable Android 16 compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Run shared JVM tests
        run: gradle :shared:jvmTest --stacktrace
      - name: Verify prototype JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('prototype/index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>(.*?)</script>', html, re.S)
          assert script, 'prototype script not found'
          pathlib.Path('/tmp/salat-prototype.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/salat-prototype.js
