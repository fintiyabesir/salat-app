name: SalatApp
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  SalatApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SalatApp
        excludes:
          - Info.plist
          - SalatApp.entitlements
      - path: GlanceShared
      - path: ../resources/city_catalog.tsv
        buildPhase: resources
    info:
      path: SalatApp/Info.plist
    entitlements:
      path: SalatApp/SalatApp.entitlements
    preBuildScripts:
      - name: Generate App Icon
        script: |
          python3 "$SRCROOT/../scripts/generate_app_icon.py" --output "$SRCROOT/SalatApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        outputFiles:
          - $(SRCROOT)/SalatApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.salat.mobile
        PRODUCT_NAME: Salat
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/SalatShared.framework
        embed: false
      - target: SalatWidgetExtension

  SalatWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SalatWidget
        excludes:
          - Info.plist
          - SalatWidget.entitlements
      - path: GlanceShared
    info:
      path: SalatWidget/Info.plist
    entitlements:
      path: SalatWidget/SalatWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.salat.mobile.widget
        PRODUCT_NAME: SalatWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES

schemes:
  SalatApp:
    build:
      targets:
        SalatApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
